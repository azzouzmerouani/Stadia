name: stadia
description: "Stadia – stadium ticket booking with a 3D seat picker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  intl: ^0.20.2
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/3d/
    - assets/clubs/
    - assets/web/
    - assets/web/draco/
    - assets/web/fonts/
  # Cairo (SIL OFL 1.1, assets/fonts/OFL.txt): static cuts of the Google
  # Fonts variable font, so FontWeight maps to real weights everywhere.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

