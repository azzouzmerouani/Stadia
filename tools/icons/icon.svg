<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Stadia app icon, full bleed (iOS masks it; web "maskable"; the
       rounded versions are cut from it by build_icons.sh). The mark is the
       app's stadium glyph (24-unit grid, centred on 12,12). -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00FF87"/>
      <stop offset="1" stop-color="#05F0FF"/>
    </linearGradient>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#541E5D"/>
      <stop offset="1" stop-color="#1E0021"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 524) scale(26) translate(-12 -12)" fill="none"
     stroke="url(#g)" stroke-width="1.9" stroke-linecap="round">
    <ellipse cx="12" cy="10" rx="9" ry="4"/>
    <ellipse cx="12" cy="10" rx="4" ry="1.7"/>
    <path d="M3 10V14M21 10V14M3 14A9 4 0 0 0 21 14"/>
  </g>
</svg>
