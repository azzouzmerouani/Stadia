<!DOCTYPE html>
<html lang="ar">
<head>
  <!-- Replaced by `flutter build web --base-href /path/` when the app is
       served from a sub-path; it must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stadia: pick your team, fly into the stadium in 3D and see the view from your seat before you buy your ticket.">
  <meta name="theme-color" content="#1E0021">
  <meta name="color-scheme" content="dark">

  <!-- iOS: add to home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stadia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Stadia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The app's page colour from the first paint: no white flash. */
    html, body { margin: 0; height: 100%; background: #1E0021; }
    /* Until Flutter draws its first frame. */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; }
    #boot svg { width: 64px; height: 64px; animation: boot 1.4s ease-in-out infinite; }
    @keyframes boot { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00FF87"/><stop offset="1" stop-color="#05F0FF"/></linearGradient></defs>
      <g fill="none" stroke="url(#g)" stroke-width="1.9" stroke-linecap="round">
        <ellipse cx="12" cy="10" rx="9" ry="4"/><ellipse cx="12" cy="10" rx="4" ry="1.7"/>
        <path d="M3 10V14M21 10V14M3 14A9 4 0 0 0 21 14"/>
      </g>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
