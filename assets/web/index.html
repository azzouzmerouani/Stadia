<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Stadia 3D</title>
  <style>
    /* Same Cairo the Flutter UI uses (SIL OFL), served from the loopback. */
    @font-face {
      font-family: Cairo;
      font-weight: 600;
      src: url('fonts/Cairo-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: Cairo;
      font-weight: 700;
      src: url('fonts/Cairo-Bold.ttf') format('truetype');
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #1E0021;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#stage {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      outline: none;
    }
    #labels {
      position: fixed;
      inset: 0;
      pointer-events: none;
      font: 600 12px/1.25 Cairo, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .lbl {
      position: absolute;
      left: 0;
      top: 0;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(40, 0, 43, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
      will-change: transform;
      transition: opacity 0.25s ease;
    }
    .lbl.stand { font-size: 13px; font-weight: 700; padding: 4px 12px; }
    .lbl.block { font-size: 10.5px; padding: 2px 8px; background: rgba(40, 0, 43, 0.74); box-shadow: none; }
    .lbl.block .dot { width: 5px; height: 5px; margin-inline-end: 4px; }
    .lbl .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-inline-end: 6px;
      vertical-align: 1px;
    }
    .lbl.sold { color: rgba(255, 255, 255, 0.45); }
    .lbl.on { border-color: #05F0FF; }
    #fade {
      position: fixed;
      inset: 0;
      background: #1E0021;
      opacity: 1;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }
    #debug {
      position: fixed;
      left: 8px;
      bottom: 8px;
      font: 11px/1.3 ui-monospace, Menlo, monospace;
      color: #05f0ff;
      pointer-events: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="labels"></div>
  <div id="fade"></div>
  <div id="debug"></div>
  <script>
    // Flutter web runs this page in a same-origin <iframe>: with no
    // webview_flutter channel (iOS/Android inject StadiaBridge before any
    // script runs), the bridge is postMessage to and from the parent.
    // Messages from any other window or origin are dropped.
    (function () {
      if (window.StadiaBridge || window.parent === window) return;
      var origin = window.location.origin;
      window.StadiaBridge = {
        postMessage: function (json) {
          window.parent.postMessage({ stadiaBridge: String(json) }, origin);
        }
      };
      window.addEventListener('message', function (e) {
        if (e.source !== window.parent || e.origin !== origin) return;
        var d = e.data;
        if (d && typeof d.stadia === 'string' && window.stadia) window.stadia.receive(d.stadia);
      });
    })();
  </script>
  <script>
    // Surface load/runtime failures to Flutter (no console there).
    (function () {
      function report(message) {
        var b = window.StadiaBridge;
        if (b && b.postMessage) b.postMessage(JSON.stringify({ type: 'error', message: String(message) }));
      }
      window.addEventListener('error', function (e) { report((e && e.message) || 'script error'); });
      window.addEventListener('unhandledrejection', function (e) { report((e && e.reason && e.reason.message) || e.reason || 'rejection'); });
    })();
  </script>
  <script src="stadium.js"></script>
</body>
</html>
